name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  # Build deb, rpm, AppImage, zip for x64
  build-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install system deps
        run: sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run build

      - name: Package (deb, rpm, AppImage, zip — x64)
        run: bunx electron-builder --config=config/builder.json --publish never -l deb rpm AppImage zip --x64

      - name: Generate release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_ESCAPED=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk "/^## \[$VERSION_ESCAPED\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' | sed '1{/^---/d}' > release_notes
          echo "--- release_notes preview ---"
          cat release_notes

      - uses: actions/upload-artifact@v4
        with:
          name: installers-x64
          path: build/installers/figma-linux-next_*

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes

  # Build deb, rpm, AppImage, zip for arm64 on native ARM runner
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install system deps
        run: sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run build

      - name: Package (deb, rpm, AppImage, zip — arm64)
        run: bunx electron-builder --config=config/builder.json --publish never -l deb rpm AppImage zip --arm64

      - uses: actions/upload-artifact@v4
        with:
          name: installers-arm64
          path: build/installers/figma-linux-next_*

  # Build pacman package on Arch Linux (x64 only, needs makepkg)
  build-pacman:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: pacman -Sy --noconfirm bun nodejs npm base-devel fakeroot libxcrypt-compat

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run build

      - name: Package (pacman)
        run: bunx electron-builder --config=config/builder.json --publish never -l pacman

      - uses: actions/upload-artifact@v4
        with:
          name: installer-pacman
          path: build/installers/figma-linux-next_*_linux_x64.pacman

  # Create GitHub Release with all artifacts
  release:
    needs: [build-x64, build-arm64, build-pacman]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'installers-*'
          merge-multiple: true
          path: ./artifacts

      - uses: actions/download-artifact@v4
        with:
          name: installer-pacman
          path: ./artifacts

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./

      - name: Compute SHA256SUMS
        working-directory: ./artifacts
        run: sha256sum figma-linux-next_* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./release_notes
          name: figma-linux-next ${{ github.ref_name }}
          files: |
            ./artifacts/figma-linux-next_*
            ./artifacts/SHA256SUMS

  # Push updated PKGBUILD to AUR
  aur:
    needs: release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pacman -Sy --noconfirm git openssh pacman python curl

      - name: Setup SSH for AUR
        run: |
          mkdir -p /root/.ssh
          echo "${{ secrets.ID_RSA }}" | base64 -d > /root/.ssh/id_rsa
          ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/id_rsa

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/figma-linux-next.git /tmp/aur-pkg
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/id_rsa -o UserKnownHostsFile=/root/.ssh/known_hosts

      - name: Update PKGBUILD
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TARBALL_URL="https://github.com/arximus88/figma-linux-next/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)

          cd /tmp/aur-pkg
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          python3 $GITHUB_WORKSPACE/scripts/update_pkgbuild_sha256.py "$SHA256" PKGBUILD

      - name: Generate .SRCINFO
        run: |
          cd /tmp/aur-pkg
          git config user.name "${{ secrets.USER_NAME }}"
          git config user.email "${{ secrets.EMAIL }}"
          useradd -m builder
          chown -R builder:builder /tmp/aur-pkg
          su builder -c "cd /tmp/aur-pkg && makepkg --printsrcinfo > .SRCINFO"

      - name: Commit and push to AUR
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git config --global --add safe.directory /tmp/aur-pkg
          cd /tmp/aur-pkg
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "Update to v${VERSION}"
          git push
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/id_rsa -o UserKnownHostsFile=/root/.ssh/known_hosts
