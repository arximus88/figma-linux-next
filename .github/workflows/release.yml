name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  # Build deb, rpm, AppImage, zip for x64
  build-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install system deps
        run: sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run build

      - name: Package (deb, rpm, AppImage, zip — x64)
        run: bunx electron-builder --config=config/builder.json --publish never -l deb rpm AppImage zip --x64

      - name: Generate release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_ESCAPED=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk "/^## \[$VERSION_ESCAPED\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' | sed '1{/^---/d}' > release_notes
          echo "--- release_notes preview ---"
          cat release_notes

      - uses: actions/upload-artifact@v4
        with:
          name: installers-x64
          path: build/installers/figma-linux-next_*

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes

  # Build deb, rpm, AppImage, zip for arm64 on native ARM runner
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install system deps
        run: sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run build

      - name: Package (deb, rpm, AppImage, zip — arm64)
        run: bunx electron-builder --config=config/builder.json --publish never -l deb rpm AppImage zip --arm64

      - uses: actions/upload-artifact@v4
        with:
          name: installers-arm64
          path: build/installers/figma-linux-next_*

  # Build pacman package on Arch Linux (x64 only, needs makepkg)
  build-pacman:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install deps
        run: pacman -Sy --noconfirm bun nodejs npm base-devel fakeroot libxcrypt-compat

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run build

      - name: Package (pacman)
        run: bunx electron-builder --config=config/builder.json --publish never -l pacman

      - uses: actions/upload-artifact@v4
        with:
          name: installer-pacman
          path: build/installers/figma-linux-next_*_linux_x64.pacman

  # Create GitHub Release with all artifacts
  release:
    needs: [build-x64, build-arm64, build-pacman]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'installers-*'
          merge-multiple: true
          path: ./artifacts

      - uses: actions/download-artifact@v4
        with:
          name: installer-pacman
          path: ./artifacts

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./

      - name: Compute SHA256SUMS
        working-directory: ./artifacts
        run: sha256sum figma-linux-next_* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./release_notes
          name: figma-linux-next ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: |
            ./artifacts/figma-linux-next_*
            ./artifacts/SHA256SUMS

  # Push updated PKGBUILD to AUR (both packages in parallel)
  # Skipped on pre-release tags (-rc, -alpha, -beta) so dry-runs don't publish to AUR.
  aur:
    needs: release
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: pacman -Sy --noconfirm git openssh pacman python curl

      - name: Setup SSH for AUR
        run: |
          mkdir -p /root/.ssh
          echo "${{ secrets.ID_RSA }}" | base64 -d > /root/.ssh/id_rsa
          ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/id_rsa

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/figma-linux-next.git /tmp/aur-pkg
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/id_rsa -o UserKnownHostsFile=/root/.ssh/known_hosts

      - name: Update PKGBUILD
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TARBALL_URL="https://github.com/arximus88/figma-linux-next/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)

          cd /tmp/aur-pkg
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          python3 $GITHUB_WORKSPACE/scripts/update_pkgbuild_sha256.py "$SHA256" PKGBUILD

      - name: Generate .SRCINFO
        run: |
          cd /tmp/aur-pkg
          git config user.name "${{ secrets.USER_NAME }}"
          git config user.email "${{ secrets.EMAIL }}"
          useradd -m builder
          chown -R builder:builder /tmp/aur-pkg
          su builder -c "cd /tmp/aur-pkg && makepkg --printsrcinfo > .SRCINFO"

      - name: Commit and push to AUR
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git config --global --add safe.directory /tmp/aur-pkg
          cd /tmp/aur-pkg
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "Update to v${VERSION}"
          git push
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/id_rsa -o UserKnownHostsFile=/root/.ssh/known_hosts

  aur-bin:
    needs: release
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: pacman -Sy --noconfirm git openssh pacman python curl

      - name: Setup SSH for AUR
        run: |
          mkdir -p /root/.ssh
          echo "${{ secrets.ID_RSA }}" | base64 -d > /root/.ssh/id_rsa
          ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/id_rsa

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/figma-linux-next-bin.git /tmp/aur-bin
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/id_rsa -o UserKnownHostsFile=/root/.ssh/known_hosts

      - name: Update PKGBUILD
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ZIP_URL="https://github.com/arximus88/figma-linux-next/releases/download/v${VERSION}/figma-linux-next_${VERSION}_linux_x64.zip"
          SHA256=$(curl -sL "$ZIP_URL" | sha256sum | cut -d' ' -f1)

          cd /tmp/aur-bin
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          python3 $GITHUB_WORKSPACE/scripts/update_pkgbuild_sha256.py "$SHA256" PKGBUILD

      - name: Generate .SRCINFO
        run: |
          cd /tmp/aur-bin
          git config user.name "${{ secrets.USER_NAME }}"
          git config user.email "${{ secrets.EMAIL }}"
          useradd -m builder
          chown -R builder:builder /tmp/aur-bin
          su builder -c "cd /tmp/aur-bin && makepkg --printsrcinfo > .SRCINFO"

      - name: Commit and push to AUR
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git config --global --add safe.directory /tmp/aur-bin
          cd /tmp/aur-bin
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "Update to v${VERSION}"
          git push
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/id_rsa -o UserKnownHostsFile=/root/.ssh/known_hosts

  # Pin flake.nix to the release that just went out.
  #
  # Nix needs the archive's hash written into the repo, and that hash only exists
  # once the binaries are built — so this cannot be part of bump_version.pl and
  # has to land after the release is published. dev is where Nix resolves
  # `github:arximus88/figma-linux-next` from, so dev is updated first and staging
  # mirrored after; leaving dev for the next release PR would keep NixOS users a
  # full release behind.
  #
  # RELEASE_PAT is a fine-grained token (Contents: write on this repo only) and is
  # needed because the default GITHUB_TOKEN cannot push to a protected branch.
  # This job runs last and depends on `release`, so if the push is rejected the
  # release itself, its binaries and both AUR packages are already out.
  flake:
    needs: release
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          token: ${{ secrets.RELEASE_PAT }}

      - name: Hash the released binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/v${VERSION}"

          # -f so a missing asset fails the job instead of hashing an error page.
          X64=$(curl -sfL "$BASE/figma-linux-next_${VERSION}_linux_x64.zip" | sha256sum | cut -d' ' -f1)
          ARM64=$(curl -sfL "$BASE/figma-linux-next_${VERSION}_linux_arm64.zip" | sha256sum | cut -d' ' -f1)

          {
            echo "VERSION=$VERSION"
            echo "X64=$X64"
            echo "ARM64=$ARM64"
          } >> "$GITHUB_ENV"

          # Kept outside the worktree so the staging step below can still run it
          # after switching branches, whatever that branch contains.
          cp scripts/update_flake_release.py /tmp/update_flake_release.py

      - name: Commit to dev
        run: |
          git config user.name "${{ secrets.USER_NAME }}"
          git config user.email "${{ secrets.EMAIL }}"
          python3 /tmp/update_flake_release.py "$VERSION" "$X64" "$ARM64" flake.nix
          git add flake.nix
          git diff --staged --quiet || git commit -m "chore(nix): pin flake to v${VERSION}"
          git push origin dev

      - name: Mirror to staging
        run: |
          git fetch origin staging:staging
          git checkout staging
          python3 /tmp/update_flake_release.py "$VERSION" "$X64" "$ARM64" flake.nix
          git add flake.nix
          git diff --staged --quiet || git commit -m "chore(nix): pin flake to v${VERSION}"
          git push origin staging
