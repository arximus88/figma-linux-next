name: CI

on:
  push:
    branches: [staging, dev]
  pull_request:
    branches: [staging, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test src/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Electron system deps + Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxtst6 \
            xdg-utils libatspi2.0-0 libdrm2 libgbm1

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: xvfb-run --auto-servernum bunx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
