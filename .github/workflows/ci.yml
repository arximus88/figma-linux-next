name: CI

on:
  push:
    branches: [staging, dev]
  pull_request:
    branches: [staging, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate changelog _data.ts
        run: bun run gen:changelog

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test tests/unit/

      # A stale tag: in the Flatpak manifest builds and installs cleanly while
      # packaging the previous release, so nothing else would catch it.
      - name: Flatpak release metadata
        run: python3 scripts/sync_flatpak_release.py --check
