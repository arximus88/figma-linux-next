name: figma-linux-next
version: '0.13.0'
summary: Unofficial Figma desktop app for Linux
description: |
  figma-linux-next is a fork of the unofficial desktop application for Figma,
  the collaborative interface design tool. This version includes native Wayland
  support, GPU acceleration, and optimizations for modern Linux desktops.

  Features:
  - Native Wayland support with proper window decorations
  - GPU acceleration for WebGL/WebAssembly rendering
  - Customizable window frame styles (Windows/GNOME)
  - Deep linking support (figma:// protocol)
  - Local font access for design work
  - System tray integration

  Note: This is an unofficial application and is not affiliated with Figma Inc.

grade: stable
confinement: strict
base: core22
license: MIT

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  figma-linux-next:
    command: figma-linux-next
    desktop: usr/share/applications/figma-linux-next.desktop
    extensions: [gnome]
    plugs:
      - home
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - browser-support
      - gsettings
      - unity7
      - removable-media
    environment:
      # Wayland support
      DISABLE_WAYLAND: '0'
      ELECTRON_ENABLE_WAYLAND: '1'
      # GPU acceleration
      LIBGL_ALWAYS_SOFTWARE: '0'

parts:
  figma-linux-next:
    plugin: nil
    source: .
    override-build: |
      # Install dependencies
      bun install

      # Build the application
      bun run build

      # Create directory structure
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/lib/figma-linux-next
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/bin
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons

      # Copy application files
      cp -r dist $SNAPCRAFT_PART_INSTALL/usr/lib/figma-linux-next/
      cp -r resources $SNAPCRAFT_PART_INSTALL/usr/lib/figma-linux-next/
      cp package.json $SNAPCRAFT_PART_INSTALL/usr/lib/figma-linux-next/

      # Copy desktop file
      cp figma-linux-next.desktop $SNAPCRAFT_PART_INSTALL/usr/share/applications/

      # Copy icons
      for size in 16 24 32 48 64 128 256 512; do
        if [ -f resources/icons/${size}x${size}.png ]; then
          mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/apps
          cp resources/icons/${size}x${size}.png \
            $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/apps/figma-linux-next.png
        fi
      done

      # Create launcher script
      cat > $SNAPCRAFT_PART_INSTALL/usr/bin/figma-linux-next << 'EOF'
      #!/bin/bash
      exec electron $SNAP/usr/lib/figma-linux-next "$@"
      EOF
      chmod +x $SNAPCRAFT_PART_INSTALL/usr/bin/figma-linux-next

    build-packages:
      - nodejs
      - npm
      - git

    stage-packages:
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libxtst6
      - libatspi2.0-0
      - libdrm2
      - libgbm1
      - libxcb-dri3-0
      - fonts-liberation
      - fonts-noto
      - fonts-noto-color-emoji

  electron:
    plugin: nil
    override-build: |
      # Use Electron from npm
      npm install --global electron@39.6.0
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/bin
      ln -sf $(which electron) $SNAPCRAFT_PART_INSTALL/usr/bin/electron
    build-packages:
      - nodejs
      - npm

plugs:
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes

layout:
  /usr/share/libdrm:
    bind: $SNAP/usr/share/libdrm
