app-id: com.figma.FigmaLinux
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: figma-linux
separate-locales: false

finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration
  - --device=dri
  - --socket=pulseaudio
  # Network access
  - --share=network
  # Home directory access for files
  - --filesystem=home
  # Desktop integration
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.indicator.application
  - --own-name=org.kde.StatusNotifierItem-*
  # System fonts
  - --filesystem=/usr/share/fonts:ro
  - --filesystem=/usr/local/share/fonts:ro
  - --filesystem=xdg-data/fonts:ro
  # For deep linking
  - --talk-name=org.freedesktop.FileManager1

modules:
  - name: figma-linux
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node18/bin
      env:
        NPM_CONFIG_LOGLEVEL: info
    build-commands:
      # Install dependencies
      - npm install --offline --legacy-peer-deps

      # Build the application
      - npm run build

      # Install to /app
      - |
        mkdir -p /app/figma-linux
        cp -r dist /app/figma-linux/
        cp -r resources /app/figma-linux/
        cp package.json /app/figma-linux/

      # Create wrapper script
      - |
        cat > figma-linux.sh << 'EOF'
        #!/bin/bash
        export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
        export ELECTRON_IS_DEV=0
        export ELECTRON_ENABLE_WAYLAND=1

        # GPU acceleration
        export LIBGL_ALWAYS_SOFTWARE=0

        exec zypak-wrapper /app/lib/node_modules/electron/dist/electron \
          /app/figma-linux \
          --enable-features=UseOzonePlatform,WaylandWindowDecorations \
          --ozone-platform-hint=auto \
          "$@"
        EOF
        chmod +x figma-linux.sh
        install -Dm755 figma-linux.sh /app/bin/figma-linux

      # Install desktop file and icons
      - install -Dm644 figma-linux.desktop /app/share/applications/com.figma.FigmaLinux.desktop
      - |
        for size in 16 24 32 48 64 128 256 512; do
          if [ -f resources/icons/${size}x${size}.png ]; then
            install -Dm644 resources/icons/${size}x${size}.png \
              /app/share/icons/hicolor/${size}x${size}/apps/com.figma.FigmaLinux.png
          fi
        done

      # AppStream metadata
      - |
        mkdir -p /app/share/metainfo
        cat > /app/share/metainfo/com.figma.FigmaLinux.appdata.xml << 'APPDATA'
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="desktop-application">
          <id>com.figma.FigmaLinux</id>
          <metadata_license>MIT</metadata_license>
          <project_license>MIT</project_license>
          <name>Figma Linux</name>
          <summary>Unofficial Figma desktop app for Linux</summary>
          <description>
            <p>
              Figma-Linux is an unofficial desktop application for Figma, providing a native
              Linux experience with Wayland support, GPU acceleration, and system integration.
            </p>
            <p>Features:</p>
            <ul>
              <li>Native Wayland support with proper window decorations</li>
              <li>GPU acceleration for smooth rendering</li>
              <li>Customizable window frame styles (Windows/GNOME/macOS)</li>
              <li>Local font access for design work</li>
              <li>Deep linking support (figma:// URLs)</li>
            </ul>
          </description>
          <launchable type="desktop-id">com.figma.FigmaLinux.desktop</launchable>
          <url type="homepage">https://github.com/Figma-Linux/figma-linux</url>
          <url type="bugtracker">https://github.com/Figma-Linux/figma-linux/issues</url>
          <screenshots>
            <screenshot type="default">
              <image>https://raw.githubusercontent.com/ChugunovRoman/figma-linux/master/images/screenshot1.jpg</image>
            </screenshot>
          </screenshots>
          <releases>
            <release version="0.12.0" date="2025-12-11">
              <description>
                <p>Major rebuild with critical improvements:</p>
                <ul>
                  <li>Electron 39 with modern Chromium</li>
                  <li>Native Wayland support</li>
                  <li>GPU acceleration optimizations</li>
                  <li>Frame style customization</li>
                </ul>
              </description>
            </release>
          </releases>
          <content_rating type="oars-1.1"/>
        </component>
        APPDATA

    sources:
      - type: dir
        path: .
      - type: file
        path: package-lock.json
      # npm cache for offline build
      - generated-sources.json

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node18
